# Integración continua: revisa cada PR hacia dev, qa o main, y cada merge a dev.
#
# Solo corre el job de lo que cambió (backend, y en el sprint 2 también frontend).
# Al final, `ci-ok` resume a todos: es el único check obligatorio en las ramas protegidas.
# Así un job saltado por no tener cambios no deja el PR esperando para siempre.
name: CI

on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [dev]

# Si subes otro commit al mismo PR, se cancela la corrida anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ruff (errores y estilo)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: mypy (tipos)
        run: mypy src tests

      - name: pytest (pruebas)
        run: pytest

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Algún job falló o se canceló
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Todo en verde
        run: echo "Todos los jobs pasaron o no tenían cambios que revisar."
