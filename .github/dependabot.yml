# Dependabot abre PRs hacia dev cuando hay versiones nuevas de las dependencias.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    labels: [backend, dependencias]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    labels: [frontend, dependencias]
    commit-message:
      prefix: chore(deps)
    groups:
      # Un solo PR para todo lo de ESLint, TypeScript y pruebas, en lugar de diez
      herramientas:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels: [infra, dependencias]
    commit-message:
      prefix: chore(ci)
