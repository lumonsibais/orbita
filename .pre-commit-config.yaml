# Revisiones automáticas antes de cada commit.
# Se activan una vez con `pre-commit install` y se corren a mano con `pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict # que no se cuele un <<<<<<< olvidado
      - id: no-commit-to-branch # nada de commits directos en las ramas largas
        args: [--branch, dev, --branch, qa, --branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        # Usa el Prettier instalado en frontend/node_modules: corre `npm ci` en frontend/ antes
        entry: frontend/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^frontend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks # bloquea el commit si detecta una contraseña o llave
